# PHP taint rules: caller-controlled data (function parameters, superglobals, argv, environment)
# must reach the sink. Constant-only queries and commands are not reported.
rules:
  - id: mallace.php.command-injection
    languages: [php]
    severity: WARNING
    message: Caller-controlled data reaches a shell command.
    mode: taint
    pattern-sources: &input
      - patterns:
          - pattern-either:
              - pattern-inside: function $FUNC(..., $PARAM, ...) { ... }
              - pattern-inside: function (..., $PARAM, ...) { ... }
          - pattern: $PARAM
      - pattern-either:
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
          - pattern: $_SERVER
          - pattern: $_FILES
          - pattern: $argv
          - pattern: getenv(...)
          - pattern: file_get_contents('php://input')
    pattern-sanitizers:
      - pattern: escapeshellarg(...)
      - pattern: escapeshellcmd(...)
      - pattern: intval(...)
      - pattern: (int) $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: exec($CMD, ...)
              - pattern: shell_exec($CMD)
              - pattern: system($CMD, ...)
              - pattern: passthru($CMD, ...)
              - pattern: popen($CMD, ...)
              - pattern: proc_open($CMD, ...)
              - pattern: pcntl_exec($CMD, ...)
              - pattern: '`...{$CMD}...`'
          - focus-metavariable: $CMD
  - id: mallace.php.dynamic-eval
    languages: [php]
    severity: WARNING
    message: Caller-controlled data reaches dynamic code evaluation.
    mode: taint
    pattern-sources: *input
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: eval($CODE)
              - pattern: create_function($ARGS, $CODE)
          - focus-metavariable: $CODE
  - id: mallace.php.unsafe-unserialize
    languages: [php]
    severity: WARNING
    message: Caller-controlled data is unserialized, which can create arbitrary objects.
    mode: taint
    pattern-sources: *input
    pattern-sinks:
      - patterns:
          - pattern: unserialize($DATA, ...)
          - pattern-not: "unserialize($DATA, ['allowed_classes' => false, ...])"
          - pattern-not: "unserialize($DATA, array('allowed_classes' => false, ...))"
          - focus-metavariable: $DATA
  - id: mallace.php.sql-query-construction
    languages: [php]
    severity: WARNING
    message: SQL query is built from caller-controlled data instead of bound parameters.
    mode: taint
    pattern-sources:
      - label: INPUT
        patterns:
          - pattern-either:
              - pattern-inside: function $FUNC(..., $PARAM, ...) { ... }
              - pattern-inside: function (..., $PARAM, ...) { ... }
          - pattern: $PARAM
      - label: INPUT
        pattern-either:
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
          - pattern: $_SERVER
          - pattern: $argv
          - pattern: getenv(...)
      - label: BUILT
        requires: INPUT
        pattern-either:
          - pattern: $LEFT . $RIGHT
          - pattern: '"...{$X}..."'
          - pattern: sprintf(...)
    pattern-sanitizers:
      - pattern: intval(...)
      - pattern: (int) $X
      - pattern: $DB->quote(...)
      - pattern: $DB->real_escape_string(...)
      - pattern: mysqli_real_escape_string(...)
      - pattern: pg_escape_literal(...)
      - pattern: esc_sql(...)
    pattern-sinks:
      - requires: BUILT
        patterns:
          - pattern-either:
              - pattern: mysqli_query($CONN, $QUERY, ...)
              - pattern: mysqli_multi_query($CONN, $QUERY)
              - pattern: mysqli_real_query($CONN, $QUERY)
              - pattern: mysqli_prepare($CONN, $QUERY)
              - pattern: pg_query($CONN, $QUERY)
              - pattern: pg_query($QUERY)
              - pattern: sqlite_query($CONN, $QUERY, ...)
              - pattern: $DB->query($QUERY, ...)
              - pattern: $DB->exec($QUERY)
              - pattern: $DB->prepare($QUERY, ...)
              - pattern: $DB->multi_query($QUERY)
              - pattern: $DB->real_query($QUERY)
              - pattern: $DB->get_results($QUERY, ...)
              - pattern: $DB->get_var($QUERY, ...)
              - pattern: $DB->get_row($QUERY, ...)
              - pattern: $DB->get_col($QUERY, ...)
              - pattern: $DB->executeQuery($QUERY, ...)
              - pattern: $DB->executeStatement($QUERY, ...)
              - pattern: DB::select($QUERY, ...)
              - pattern: DB::statement($QUERY, ...)
              - pattern: DB::unprepared($QUERY)
              - pattern: DB::raw($QUERY)
          - focus-metavariable: $QUERY
  # XSS, stored XSS and file reads only follow web request data (not plain function parameters).
  - id: mallace.php.reflected-xss
    languages: [php]
    severity: WARNING
    message: Request data is echoed as HTML without escaping (cross-site scripting).
    mode: taint
    pattern-sources: &web
      - pattern-either:
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
          - pattern: $_SERVER['REQUEST_URI']
          - pattern: $_SERVER['QUERY_STRING']
          - pattern: $_SERVER['PATH_INFO']
          - pattern: file_get_contents('php://input')
    pattern-sanitizers: &xss_clean
      - pattern-either:
          - pattern: htmlspecialchars(...)
          - pattern: htmlentities(...)
          - pattern: esc_html(...)
          - pattern: esc_attr(...)
          - pattern: esc_url(...)
          - pattern: wp_kses(...)
          - pattern: wp_kses_post(...)
          - pattern: intval(...)
          - pattern: (int) $X
          - pattern: json_encode(...)
          - pattern: urlencode(...)
          - pattern: rawurlencode(...)
          # Reported as path traversal, not again as XSS.
          - pattern: file_get_contents(...)
          - pattern: readfile(...)
    pattern-sinks: &xss_out
      - patterns:
          - pattern-either:
              - pattern: echo $OUT;
              - pattern: print($OUT);
              - pattern: printf($OUT, ...);
              - pattern: vprintf($OUT, ...);
          - focus-metavariable: $OUT
  - id: mallace.php.stored-xss
    languages: [php]
    severity: WARNING
    message: A value read from the database is echoed as HTML without escaping (stored cross-site scripting).
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $STMT->fetch(...)
          - pattern: $STMT->fetchAll(...)
          - pattern: $STMT->fetchColumn(...)
          - pattern: $STMT->fetch_assoc()
          - pattern: $STMT->fetch_array(...)
          - pattern: $STMT->fetch_object(...)
          - pattern: mysqli_fetch_assoc(...)
          - pattern: mysqli_fetch_array(...)
          - pattern: mysqli_fetch_row(...)
          - pattern: $WPDB->get_results(...)
          - pattern: $WPDB->get_row(...)
          - pattern: $WPDB->get_var(...)
          - pattern: $WPDB->get_col(...)
    pattern-sanitizers: *xss_clean
    pattern-sinks: *xss_out
  - id: mallace.php.path-traversal
    languages: [php]
    severity: WARNING
    message: A file path taken from the request is opened without confining it to a directory (path traversal).
    mode: taint
    pattern-sources: *web
    pattern-sanitizers:
      - pattern-either:
          - pattern: basename(...)
          - pattern: intval(...)
          - pattern: (int) $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: file_get_contents($PATH, ...)
              - pattern: fopen($PATH, ...)
              - pattern: readfile($PATH, ...)
              - pattern: file($PATH, ...)
              - pattern: include $PATH;
              - pattern: include_once $PATH;
              - pattern: require $PATH;
              - pattern: require_once $PATH;
          # Reading the request body is an input source, not a file read.
          - pattern-not: file_get_contents("php://input", ...)
          - pattern-not: fopen("php://input", ...)
          - focus-metavariable: $PATH
