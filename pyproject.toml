[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mallace-public"
version = "0.1.0a1"
description = "Scoped static security assessment of Git repositories"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "LICENSE-MIT"]
dependencies = ["pydantic>=2,<3", "pydantic-settings>=2,<3"]

[project.scripts]
mallace-scan = "mallace.assessment.__main__:main"

[tool.setuptools.packages.find]
include = ["mallace*"]

[tool.setuptools.package-data]
"mallace.assessment" = ["rules/*.yml"]
